name: Update streak stats

on:
  schedule:
    - cron: "0 0 */2 * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=hrasamoe&theme=tokyonight&hide_border=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "hrasamoe"
          git config user.email "herysamuelpljv@gmail.com"
          git add assets/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
